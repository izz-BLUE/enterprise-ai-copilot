case_id: isolation_case
description: |
  Two users on the same conversation id share nothing; two conversations
  for the same user share nothing. Each evaluation case observes only its
  own initial_context and own memory_context.
initial_context:
  user_id: user-a
  conversation_id: conv-aaa
  taskType: LEAVE_REQUEST
  status: ACTIVE
turns:
  - turn_index: 1
    role: user
    user: 我接着上次的年假申请，日期补充为 2026-09-01 到 2026-09-03
    memory_context:
      user_id: user-a
      conversation_id: conv-aaa
      taskType: LEAVE_REQUEST
      status: ACTIVE
    memory_observation:
      triggered: true
      proposal:
        action: UPSERT
        task_type: LEAVE_REQUEST
        status: ACTIVE
      use_memory: true
      recovered: true
      tool_behavior:
        called:
          - leave_proposal_tool
        blocked: []
expected_trigger: true
expected_action: UPSERT
expected_task_type: LEAVE_REQUEST
expected_status: ACTIVE
expected_use_memory: true
expected_tool_behavior:
  called:
    - leave_proposal_tool
  blocked: []
