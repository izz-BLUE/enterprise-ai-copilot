# Enterprise AI Copilot —— copilot.jintianchi.cn 的 Nginx 配置
#
# 此文件是服务端配置的归档副本。
#
# 重要说明：
#   - 此片段必须包含在 `http { }` 上下文中。
#   - 每个 http 上下文只能定义一次 `limit_req_zone`。
#   - 在当前生产服务器上，此片段会合并到共享的 eat-what.conf
#     （路径为 /opt/eat-what/deploy/nginx/eat-what.conf）。
#   - 修改后，始终先运行 `nginx -t`，再运行 `nginx -s reload`。
#   - 不要执行 `nginx -s restart`；只能使用平滑 reload。

# ============================================================
# Enterprise AI Copilot —— 仅 HTTP（ACME challenge + HTTPS redirect）
# ============================================================
server {
    listen 80;
    server_name copilot.jintianchi.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# Enterprise AI Copilot —— HTTPS
# ============================================================

limit_req_zone $binary_remote_addr zone=eac_api:10m rate=2r/s;

server {
    listen 443 ssl;
    server_name copilot.jintianchi.cn;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/live/copilot.jintianchi.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/copilot.jintianchi.cn/privkey.pem;

    root /usr/share/nginx/html/copilot/current;
    index index.html;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 429 = @eac_rate_limited;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=eac_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ai-copilot-java:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
    }

    location @eac_rate_limited {
        internal;
        default_type application/json;

        add_header Retry-After "1" always;
        add_header X-Trace-Id $request_id always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        return 429 '{"answer":"当前请求较多，请稍后重试。","model":"unknown","traceId":"$request_id","success":false}';
    }
}
