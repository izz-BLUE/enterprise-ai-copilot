# Enterprise AI Copilot — Nginx configuration for copilot.jintianchi.cn
#
# This file is an ARCHIVED COPY of the server-side configuration.
#
# IMPORTANT:
#   - This snippet must be included inside an `http { }` context.
#   - `limit_req_zone` can only be defined once per http context.
#   - On the current production server, this snippet is merged into the
#     shared eat-what.conf (at /opt/eat-what/deploy/nginx/eat-what.conf).
#   - After modifying, always run `nginx -t` before `nginx -s reload`.
#   - Do NOT perform `nginx -s restart`; use smooth reload only.

# ============================================================
# Enterprise AI Copilot — HTTP-only (ACME challenge + HTTPS redirect)
# ============================================================
server {
    listen 80;
    server_name copilot.jintianchi.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# Enterprise AI Copilot — HTTPS
# ============================================================

limit_req_zone $binary_remote_addr zone=eac_api:10m rate=2r/s;

server {
    listen 443 ssl;
    server_name copilot.jintianchi.cn;

    ssl_certificate /etc/nginx/certs/live/copilot.jintianchi.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/copilot.jintianchi.cn/privkey.pem;

    root /usr/share/nginx/html/copilot/current;
    index index.html;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=eac_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ai-copilot-java:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
    }
}
