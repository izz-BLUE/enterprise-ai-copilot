services:
  phoenix:
    image: arizephoenix/phoenix:version-20.3.0
    container_name: ai-copilot-phoenix
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: ${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-7}
    volumes:
      - copilot-phoenix-data:/mnt/data
    ports:
      - "127.0.0.1:${PHOENIX_UI_PORT:-6006}:6006"
    expose:
      - "4317"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-copilot-net

  postgres:
    image: postgres:16-alpine
    container_name: ai-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}"
    volumes:
      - copilot-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-copilot-net

  python-agent:
    image: "${PYTHON_IMAGE:?PYTHON_IMAGE is required in production}"
    container_name: ai-copilot-python
    restart: unless-stopped
    environment:
      EMBEDDING_BACKEND: onnx_direct
      EMBEDDING_MODEL_PATH: /app/models/embedding/bge-small-zh-v1.5-onnx
      EMBEDDING_ONNX_FILE: onnx/model.onnx
      EMBEDDING_PROVIDER: CPUExecutionProvider
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-40}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-3}
      AI_QUEUE_TIMEOUT_MS: ${AI_QUEUE_TIMEOUT_MS:-500}
      LANGGRAPH_CHECKPOINT_DSN: "${LANGGRAPH_CHECKPOINT_DSN:?LANGGRAPH_CHECKPOINT_DSN is required in production}"
      LANGGRAPH_CHECKPOINT_CONNECT_TIMEOUT_SECONDS: ${LANGGRAPH_CHECKPOINT_CONNECT_TIMEOUT_SECONDS:-3}
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL}"
      PHOENIX_TRACING: "${PHOENIX_TRACING:-false}"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      PHOENIX_PROJECT_NAME: "${PHOENIX_PROJECT_NAME:-enterprise-ai-copilot}"
      PHOENIX_SAMPLE_RATE: "${PHOENIX_SAMPLE_RATE:-1.0}"
      PHOENIX_CAPTURE_CONTENT: "${PHOENIX_CAPTURE_CONTENT:-false}"
    volumes:
      - /opt/enterprise-ai-copilot/models/bge-small-zh-v1.5-onnx:/app/models/embedding/bge-small-zh-v1.5-onnx:ro
      - /opt/enterprise-ai-copilot/data/processed:/data/processed:ro
      - /opt/enterprise-ai-copilot/data/eval/reports:/data/eval/reports:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/agent/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ai-copilot-net

  mock-oa:
    image: "${MOCK_OA_IMAGE:?MOCK_OA_IMAGE is required in production}"
    container_name: ai-copilot-mock-oa
    restart: unless-stopped
    environment:
      MOCK_OA_DB_PATH: /data/mock-oa.sqlite3
      MOCK_OA_WEBHOOK_URL: http://java-backend:8080/api/webhooks/mock-oa/expense-approval
      MOCK_OA_WEBHOOK_SECRET: "${MOCK_OA_WEBHOOK_SECRET:?MOCK_OA_WEBHOOK_SECRET is required in production}"
      MOCK_OA_WEBHOOK_TIMEOUT_SECONDS: ${MOCK_OA_WEBHOOK_TIMEOUT_SECONDS:-5}
    volumes:
      - copilot-mock-oa-data:/data
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/docs')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - ai-copilot-net

  java-backend:
    image: "${JAVA_IMAGE:?JAVA_IMAGE is required in production}"
    container_name: ai-copilot-java
    restart: unless-stopped
    depends_on:
      python-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mock-oa:
        condition: service_healthy
    environment:
      PYTHON_AGENT_BASE_URL: http://python-agent:8000
      PYTHON_AGENT_CONNECT_TIMEOUT: ${PYTHON_AGENT_CONNECT_TIMEOUT:-3000}
      PYTHON_AGENT_READ_TIMEOUT: ${PYTHON_AGENT_READ_TIMEOUT:-50000}
      PYTHON_AGENT_HTTP_MAX_CONNECTIONS: ${PYTHON_AGENT_HTTP_MAX_CONNECTIONS:-6}
      PYTHON_AGENT_MAX_CONCURRENT_REQUESTS: ${PYTHON_AGENT_MAX_CONCURRENT_REQUESTS:-3}
      PYTHON_AGENT_ACQUIRE_TIMEOUT_MS: ${PYTHON_AGENT_ACQUIRE_TIMEOUT_MS:-500}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,https://copilot.jintianchi.cn
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required in production}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required in production}"
      BUSINESS_ACTIONS_ENABLED: ${BUSINESS_ACTIONS_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      BUSINESS_ACTIONS_REQUIRE_ADMIN: ${BUSINESS_ACTIONS_REQUIRE_ADMIN:-false}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_PUBLIC_PASSWORD: ${DEMO_PUBLIC_PASSWORD:-demo-public-2026}
      DEMO_INTERVIEW_PASSWORD: ${DEMO_INTERVIEW_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_AUTH_DEFAULT_PASSWORD: ${DEMO_AUTH_DEFAULT_PASSWORD:-}
      BUSINESS_ACTION_TTL_SECONDS: ${BUSINESS_ACTION_TTL_SECONDS:-600}
      BUSINESS_ACTION_MAX_PENDING: ${BUSINESS_ACTION_MAX_PENDING:-100}
      BUSINESS_ACTION_MAX_COMPLETED: ${BUSINESS_ACTION_MAX_COMPLETED:-500}
      DEMO_ANNUAL_LEAVE_BALANCE: ${DEMO_ANNUAL_LEAVE_BALANCE:-5.0}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      MOCK_OA_ENABLED: ${MOCK_OA_ENABLED:-false}
      MOCK_OA_BASE_URL: http://mock-oa:8010
      MOCK_OA_WEBHOOK_SECRET: "${MOCK_OA_WEBHOOK_SECRET:?MOCK_OA_WEBHOOK_SECRET is required in production}"
      EXTERNAL_APPROVAL_RECONCILIATION_INTERVAL_MS: ${EXTERNAL_APPROVAL_RECONCILIATION_INTERVAL_MS:-60000}
      EXTERNAL_APPROVAL_RECONCILIATION_BATCH_SIZE: ${EXTERNAL_APPROVAL_RECONCILIATION_BATCH_SIZE:-20}
      EXTERNAL_APPROVAL_RESUME_RETRY_INTERVAL_MS: ${EXTERNAL_APPROVAL_RESUME_RETRY_INTERVAL_MS:-60000}
      EXTERNAL_APPROVAL_RESUME_BATCH_SIZE: ${EXTERNAL_APPROVAL_RESUME_BATCH_SIZE:-20}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enterprise_ai_copilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-copilot}
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ai-copilot-net
      - eat-what-net

networks:
  ai-copilot-net:
    driver: bridge

  eat-what-net:
    external: true
    name: deploy_eat-what-net

volumes:
  copilot-postgres-data:
  copilot-phoenix-data:
  copilot-mock-oa-data:
