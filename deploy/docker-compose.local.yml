services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-copilot-postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_dev}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - copilot-postgres-local-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  copilot-postgres-local-data: