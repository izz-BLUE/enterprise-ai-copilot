services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-copilot-postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_dev}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - copilot-postgres-local-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-oa:
    build:
      context: ../mock-oa
    container_name: ai-copilot-mock-oa-local
    restart: unless-stopped
    environment:
      MOCK_OA_DB_PATH: /data/mock-oa.sqlite3
      MOCK_OA_WEBHOOK_URL: ${MOCK_OA_WEBHOOK_URL:-http://host.docker.internal:8080/api/webhooks/mock-oa/expense-approval}
      MOCK_OA_WEBHOOK_SECRET: ${MOCK_OA_WEBHOOK_SECRET:-local-mock-oa-webhook-secret}
      MOCK_OA_WEBHOOK_TIMEOUT_SECONDS: ${MOCK_OA_WEBHOOK_TIMEOUT_SECONDS:-5}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - copilot-mock-oa-local-data:/data

volumes:
  copilot-postgres-local-data:
  copilot-mock-oa-local-data:
