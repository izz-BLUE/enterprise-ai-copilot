[project]
name = "enterprise-ai-copilot"
version = "0.1.0"
description = "企业级 AI 知识库助手 - Python AI Agent 服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "python-dotenv>=1.0",
    "openai>=2.45.0",
    "sentence-transformers[onnx]>=5.5",
    "faiss-cpu>=1.14.3",
    "numpy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "arize-phoenix-otel>=0.16.1",
    "openinference-instrumentation-openai>=0.1.53",
    "openinference-instrumentation-langchain>=0.1.70",
    # P2-A: MCP Python SDK v2 stable line（与 enterprise_oa_mcp_server/ 共享同一 SDK 版本约束）
    "mcp>=2,<3",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary,pool]==3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["archive"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
