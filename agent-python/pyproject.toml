[project]
name = "enterprise-ai-copilot"
version = "0.1.0"
description = "企业级 AI 知识库助手 - Python AI Agent 服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "openai>=2.0",
    "sentence-transformers[onnx]>=5.5",
    "faiss-cpu>=1.10",
    "numpy>=2.0",
    "pydantic>=2.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
