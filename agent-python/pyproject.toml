[project]
name = "enterprise-ai-copilot"
version = "0.1.0"
description = "企业级 AI 知识库助手 - Python AI Agent 服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-dotenv>=1.0",
    "openai>=2.54.0",
    "sentence-transformers[onnx]>=5.5",
    "faiss-cpu>=1.15.0",
    "numpy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "langchain>=1.3.15",
    "langchain-core>=1.0",
    "langchain-openai>=1.5.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
