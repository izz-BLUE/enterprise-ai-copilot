[project]
name = "enterprise-oa-mcp-server"
version = "0.1.0"
description = "Enterprise OA MCP Server (Streamable HTTP) — P2-A Expense Workflow V1"
requires-python = ">=3.11"
dependencies = [
    # 官方 MCP Python SDK v2 stable line (V2 §六)。lockfile 固定实际解析版本。
    "mcp[cli]>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
