name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve safe scan range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range="$(sh .github/scripts/resolve-gitleaks-range.sh \
            "$EVENT_NAME" "$BEFORE_SHA" "$CURRENT_SHA" \
            "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan repository history
        env:
          SCAN_RANGE: ${{ steps.range.outputs.range }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --log-opts="$SCAN_RANGE" /repo
