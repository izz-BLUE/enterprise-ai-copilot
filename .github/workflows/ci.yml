# Enterprise AI Copilot - CI Pipeline
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-check:
    name: Java Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend-java
        run: chmod +x ./mvnw

      - name: Compile
        working-directory: backend-java
        run: ./mvnw compile -q

      - name: Test
        working-directory: backend-java
        run: ./mvnw test -q

  python-eval:
    name: Python RAG Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: agent-python/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('agent-python/uv.lock') }}

      - name: Install dependencies
        working-directory: agent-python
        run: uv sync --group dev

      - name: Run concurrency unit tests
        working-directory: agent-python
        run: uv run python -m pytest -q tests/test_concurrency_limiter.py tests/test_concurrency_response.py

      - name: Run baseline retrieval quality gate
        working-directory: agent-python
        run: >
          uv run python scripts/eval/eval_retrieval.py
          --rewrite-mode none
          --min-source-hit-rate 100
          --min-keyword-hit-rate 95
          --min-final-pass-rate 95

      - name: Run rule rewrite retrieval evaluation
        working-directory: agent-python
        run: uv run python scripts/eval/eval_retrieval.py --rewrite-mode rule

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  frontend-e2e:
    name: Frontend Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
