# Enterprise AI Copilot - CI Pipeline
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-check:
    name: Java Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend-java
        run: chmod +x ./mvnw

      - name: Compile
        working-directory: backend-java
        run: ./mvnw compile -q

      - name: Test
        working-directory: backend-java
        run: ./mvnw test -q

  python-eval:
    name: Python RAG Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: agent-python/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('agent-python/uv.lock') }}

      - name: Install dependencies
        working-directory: agent-python
        run: uv sync

      - name: Run baseline retrieval quality gate
        working-directory: agent-python
        run: >
          uv run python scripts/eval/eval_retrieval.py
          --rewrite-mode none
          --min-source-hit-rate 100
          --min-keyword-hit-rate 95
          --min-final-pass-rate 95

      - name: Run rule rewrite retrieval evaluation
        working-directory: agent-python
        run: uv run python scripts/eval/eval_retrieval.py --rewrite-mode rule

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
