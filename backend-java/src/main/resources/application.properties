spring.application.name=enterprise-ai-copilot-backend
python.agent.base-url=http://localhost:8000
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{traceId}] %-5level %logger{36} - %msg%n

# Optional server-only hardening token for controlled business actions.
# Browser administration/evaluation is authorized by the verified JWT ADMIN role.
# When BUSINESS_ACTIONS_REQUIRE_ADMIN=true, internal action requests must also
# present a matching X-Admin-Token; the browser never carries this secret.
# Production may provide it through ADMIN_TOKEN.
admin.token=

# FIX-001: CORS allowed origins (comma-separated)
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# FIX-013: Java -> Python timeout (milliseconds)
python.agent.connect-timeout=3000
python.agent.read-timeout=50000
python.agent.http-max-connections=${PYTHON_AGENT_HTTP_MAX_CONNECTIONS:6}

# Bounded admission control for Java -> Python AI calls
python.agent.max-concurrent-requests=3
python.agent.acquire-timeout-ms=500
app.version=${APP_VERSION:dev}
app.git-commit=${GIT_COMMIT:unknown}
app.build-time=${BUILD_TIME:unknown}

# Stateless JWT authentication. No production-safe default is provided.
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.issuer=${AUTH_JWT_ISSUER:enterprise-ai-copilot}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:enterprise-ai-copilot}
auth.jwt.access-token-ttl-seconds=${AUTH_JWT_TTL_SECONDS:3600}
auth.jwt.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Demo auth seed. This flag only controls the fixed demo accounts; it does not
# disable the authentication framework or existing app_user accounts.
demo.auth.enabled=${DEMO_AUTH_ENABLED:false}
# DEMO_AUTH_DEFAULT_PASSWORD is retained only for the legacy lisi/wangwu seeds.
# The public demo, interview demo and Mock OA admin each have a separate boundary.
demo.auth.default-password=${DEMO_AUTH_DEFAULT_PASSWORD:}
demo.auth.public-password=${DEMO_PUBLIC_PASSWORD:demo-public-2026}
demo.auth.interview-password=${DEMO_INTERVIEW_PASSWORD:}
demo.auth.admin-password=${DEMO_ADMIN_PASSWORD:}
demo.auth.zhangsan-annual-balance=${DEMO_AUTH_ZHANGSAN_ANNUAL_BALANCE:10.0}
demo.auth.lisi-annual-balance=${DEMO_AUTH_LISI_ANNUAL_BALANCE:5.0}
demo.auth.wangwu-annual-balance=${DEMO_AUTH_WANGWU_ANNUAL_BALANCE:15.0}

# Controlled business actions use PostgreSQL persistence and are disabled by default.
business.actions.enabled=${BUSINESS_ACTIONS_ENABLED:false}
business.actions.require-admin=${BUSINESS_ACTIONS_REQUIRE_ADMIN:false}
business.actions.ttl-seconds=${BUSINESS_ACTION_TTL_SECONDS:600}
business.actions.max-pending=${BUSINESS_ACTION_MAX_PENDING:100}
business.actions.max-completed=${BUSINESS_ACTION_MAX_COMPLETED:500}
business.actions.demo-annual-leave-balance=${DEMO_ANNUAL_LEAVE_BALANCE:5.0}
business.actions.timezone=${BUSINESS_TIMEZONE:Asia/Shanghai}

# Internal token used by Python Agent → Java internal endpoints.
# 只读 Tool 空值时返回 LEAVE_READ_DISABLED。
# 生产环境必须设置，建议通过环境变量 JAVA_INTERNAL_TOKEN 覆盖。
leave.read.internal-token=${JAVA_INTERNAL_TOKEN:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterprise_ai_copilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:copilot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# P3-5B2a independent Mock OA submission and authenticated webhook, P3-5B2b
# receiver-side approval reconciliation, and P3-5B3 Java -> Python external
# resume delivery. Workers are always scheduled; local/prod wiring controls
# provider availability while interval and batch settings bound their workload.
external.approval.mock-oa.enabled=${MOCK_OA_ENABLED:false}
external.approval.mock-oa.base-url=${MOCK_OA_BASE_URL:}
external.approval.mock-oa.connect-timeout=${MOCK_OA_CONNECT_TIMEOUT:3000}
external.approval.mock-oa.read-timeout=${MOCK_OA_READ_TIMEOUT:5000}
external.approval.mock-oa.webhook-secret=${MOCK_OA_WEBHOOK_SECRET:}
external.approval.mock-oa.webhook-replay-window-seconds=${MOCK_OA_WEBHOOK_REPLAY_WINDOW_SECONDS:300}
external.approval.retry.fixed-delay-ms=${EXTERNAL_APPROVAL_RETRY_DELAY_MS:30000}
external.approval.retry.batch-size=${EXTERNAL_APPROVAL_RETRY_BATCH_SIZE:20}
external.approval.reconciliation.interval-ms=${EXTERNAL_APPROVAL_RECONCILIATION_INTERVAL_MS:60000}
external.approval.reconciliation.batch-size=${EXTERNAL_APPROVAL_RECONCILIATION_BATCH_SIZE:20}
external.approval.resume.retry-interval-ms=${EXTERNAL_APPROVAL_RESUME_RETRY_INTERVAL_MS:60000}
external.approval.resume.batch-size=${EXTERNAL_APPROVAL_RESUME_BATCH_SIZE:20}
