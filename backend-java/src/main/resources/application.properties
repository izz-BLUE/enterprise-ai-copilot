spring.application.name=enterprise-ai-copilot-backend
python.agent.base-url=http://localhost:8000
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{traceId}] %-5level %logger{36} - %msg%n

# Admin Token for Evaluation access control
# 空值 = 本地 Demo 模式（X-Allow-Eval=true，所有功能可用）
# 非空 = 需要请求头 X-Admin-Token 匹配才允许 eval 路由
# 生产环境必须设置，建议通过环境变量 ADMIN_TOKEN 覆盖
admin.token=

# FIX-001: CORS allowed origins (comma-separated)
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# FIX-013: Java -> Python timeout (milliseconds)
python.agent.connect-timeout=3000
python.agent.read-timeout=40000

# Bounded admission control for Java -> Python AI calls
python.agent.max-concurrent-requests=3
python.agent.acquire-timeout-ms=500
app.version=${APP_VERSION:dev}
app.git-commit=${GIT_COMMIT:unknown}
app.build-time=${BUILD_TIME:unknown}

# Controlled business actions are an in-memory sandbox and are disabled by default.
business.actions.enabled=${BUSINESS_ACTIONS_ENABLED:false}
business.actions.require-admin=${BUSINESS_ACTIONS_REQUIRE_ADMIN:true}
business.actions.ttl-seconds=${BUSINESS_ACTION_TTL_SECONDS:600}
business.actions.max-pending=${BUSINESS_ACTION_MAX_PENDING:100}
business.actions.max-completed=${BUSINESS_ACTION_MAX_COMPLETED:500}
business.actions.demo-annual-leave-balance=${DEMO_ANNUAL_LEAVE_BALANCE:5.0}
business.actions.timezone=${BUSINESS_TIMEZONE:Asia/Shanghai}
